<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELLO BENNY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0b1f2a;
      --bg-mid: #163a2e;
      --bg-glow: #2a4a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(255, 140, 66, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(46, 196, 182, 0.22), transparent 50%),
        linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 45%, var(--bg-glow));
      color: #f7f3eb;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(3.5rem, 14vw, 9rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 0.95;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(
        105deg,
        #ff6b35 0%,
        #f7c948 28%,
        #2ec4b6 58%,
        #4cc9f0 78%,
        #ff6b35 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: drift 8s ease-in-out infinite alternate, rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.35));
    }

    @keyframes drift {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <h1>HELLO BENNY</h1>
</body>
</html>
